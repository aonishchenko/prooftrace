<title>ProofTrace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Hanken+Grotesk:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
* { box-sizing: border-box; }
html, body { background: #FCF8F2; }
body { margin: 0; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid #C4501A; outline-offset: 2px; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); transform: translateX(-50%); background: #2B2420; color: #fff; padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: 14px; z-index: 9; }
.ds { min-height: 100vh; }
.pad.A, .foot { max-width: 1280px; margin-inline: auto; }
.ds { --bg: #FCF8F2; --surface: #FFFFFF; --ink: #2B2420; --muted: #74685F; --faint: #9A8D83; --line: #ECE3D8; --line-2: #F3ECE3;
  --accent: #C4501A; --accent-ink: #FFFFFF; --mark: #F2B33D; --mark-soft: #FCEBC4;
  --ok: #1E6B4E; --ok-bg: #E7F3EC; --mid: #7A5600; --mid-bg: #FFF1C6; --gap: #B4471A; --gap-bg: #FDEBE1;
  --shadow: 0 1px 2px rgba(80,55,30,.04), 0 14px 34px rgba(80,55,30,.07);
  background: var(--bg); color: var(--ink); font-family: "Hanken Grotesk", system-ui, sans-serif; font-size: 16px; line-height: 1.6; }
.ds .serif { font-family: "Gloock", Georgia, serif; font-weight: 400; }
.ds .lbl { font: 500 11.5px "DM Mono", ui-monospace, monospace; letter-spacing: .09em; text-transform: uppercase; color: var(--faint); margin: 0; }
.ds a { color: var(--ink); text-decoration-color: var(--mark); text-decoration-thickness: 2px; text-underline-offset: 3px; }
.ds p { margin: 0; }

/* top bar + wordmark */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px clamp(18px, 3vw, 40px); border-bottom: 1px solid var(--line); background: var(--bg); }
.wm { display: inline-flex; align-items: center; gap: 2px; text-decoration: none; color: var(--ink); font: 400 26px/1 "Gloock", Georgia, serif; letter-spacing: -.01em; }
.wm .p { position: relative; }
.wm .p::after { content: ""; position: absolute; left: 0; right: 0; bottom: -3px; height: 3px; border-radius: 2px; background: var(--mark); }
.wm svg { width: 18px; height: 18px; margin-left: 5px; transform: translateY(-9px); color: var(--accent); }
.nav { display: flex; gap: 22px; font-size: 14.5px; font-weight: 600; }
.nav a { color: var(--muted); text-decoration: none; }
.nav a:hover { color: var(--ink); }
.pad { padding: clamp(20px, 3vw, 40px); }
.foot { font-size: 12.5px; color: var(--faint); padding: 0 clamp(20px, 3vw, 40px) 28px; max-width: 110ch; }

/* shared pieces */
.ask { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 6px; }
.ask:focus-within { border-color: var(--ink); }
.ask input { border: 0; background: transparent; padding: 10px 12px; min-width: 0; color: var(--ink); }
.ask input:focus-visible { outline: none; }
.cta { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 9px; padding: 11px 20px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.cta:disabled { opacity: .6; cursor: progress; }
.textlink { background: none; border: 0; padding: 2px 0; cursor: pointer; font-weight: 700; color: var(--ink); text-decoration: underline; text-decoration-color: var(--mark); text-decoration-thickness: 2px; text-underline-offset: 4px; }
.exs { display: flex; flex-wrap: wrap; gap: 6px 24px; align-items: baseline; }
.ex { background: none; border: 0; padding: 4px 0; cursor: pointer; display: inline-flex; gap: 8px; align-items: baseline; border-bottom: 2px solid transparent; color: var(--muted); }
.ex b { color: var(--ink); }
.ex[aria-pressed="true"] { border-bottom-color: var(--mark); }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 7px 16px 7px 9px; border-radius: 999px; font-weight: 700; font-size: 16px; line-height: 1.1; justify-self: start; }
.pill svg { width: 24px; height: 24px; flex: none; }
.v-backed { background: var(--ok-bg); color: var(--ok); } .v-vague { background: var(--mid-bg); color: var(--mid); } .v-not_public { background: var(--gap-bg); color: var(--gap); }
.tip { border-left: 2px solid var(--mark); padding-left: 14px; font-weight: 600; }
.evi { display: grid; grid-template-columns: 20px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line-2); }
.evi svg { width: 18px; height: 18px; margin-top: 3px; }
.s-found { color: var(--ok); } .s-partial { color: var(--mid); } .s-not_found { color: var(--gap); }
.evi .n { color: var(--ink); font-weight: 700; } .evi .x { color: var(--muted); font-size: 14.5px; }
.act { display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 16px; }
.act .h { font-weight: 800; }
.act .q { font: 400 17px/1.45 "Gloock", Georgia, serif; }
.act textarea { width: 100%; min-height: 110px; border: 1.5px solid var(--line); border-radius: 10px; padding: 12px; background: var(--bg); color: var(--ink); resize: vertical; }
.steps { list-style: none; margin: 0; padding: 0; }
.steps li { display: grid; grid-template-columns: 22px 1fr; gap: 12px; padding-bottom: 14px; position: relative; }
.steps li:not(:last-child)::before { content: ""; position: absolute; left: 10px; top: 24px; bottom: 2px; width: 1.5px; background: var(--line); }
.steps li.done:not(:last-child)::before { background: var(--ink); }
.dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--line); color: var(--faint); font: 500 11px "DM Mono", monospace; background: var(--surface); }
.steps li.done .dot { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.steps li.run .dot { border-color: var(--mark); color: var(--ink); animation: pulse 1s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 5px var(--mark-soft); } }
.steps li:not(.done):not(.run) { opacity: .5; }
.steps .d, .steps .src { display: none; }
.steps li { padding-bottom: 10px; }
.steps .t { font-weight: 700; }
.steps .d { font-size: 14.5px; color: var(--muted); }
.steps .src { font: 500 11px "DM Mono", monospace; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
.pop { animation: pop .45s cubic-bezier(.2,1.4,.4,1); }
@keyframes pop { from { transform: scale(.95); opacity: .3; } }
.wait { color: var(--muted); padding: 28px 0; }

/* A: Studio */
.A .top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 16px 40px; align-items: center; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
.A h2 { margin: 0; font-size: clamp(28px, 3.4vw, 40px); line-height: 1.08; letter-spacing: -.01em; text-wrap: balance; }
.A .lead { color: var(--muted); margin-top: 8px; }
.A .inputs { display: grid; gap: 12px; }
.A .work { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 44px; margin-top: 26px; align-items: start; }
.A .claimq { font-size: 22px; line-height: 1.35; margin: 6px 0 8px; }
.A .meta { font-size: 13.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 16px; }
.A .prog { height: 2px; background: var(--line); margin: 18px 0; } .A .prog i { display: block; height: 100%; width: 0; background: var(--ink); transition: width .5s; }
.A .result { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 26px; box-shadow: var(--shadow); display: grid; gap: 18px; }
.A .result .blk { display: grid; gap: 4px; }
.ds .sum { font-size: 18px; font-weight: 600; line-height: 1.4; }
.evi { padding: 8px 0; }

@media (max-width: 900px) {
  .A .top, .A .work { grid-template-columns: 1fr; }
  .nav { display: none; }
}
@media (max-width: 520px) { .ask { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

pages for individual ingredients", "status": "partial", "note": "Specific evidence for some ingredients, not all.", "url": null}, {"name": "Independent scheme covering all ingredients", "status": "not_found", "note": "No single scheme covers the claim as written.", "url": null}], "next_action": {"type": "rewrite", "label": "Copy suggested rewrite", "text": "The [ingredient] in this product is bought directly from [named supplier or cooperative] in [country], under [named scheme or published standard]."}, "team_check": "Before the demo, copy the exact claim wording and page address from lush.com, and confirm which ingredient pages name suppliers.", "summary": "The words are wider than the evidence.", "tip_short": "Name the ingredient, the supplier and the standard.", "takeaway": "Ask the brand what it covers."}, "ysl": {"id": "ysl", "brand": "YSL Beauty", "parent": "L'Oréal", "claim_type": "Packaging claim with numbers", "claim_text": "Refilling the Eau de Parfum Intense bottle helps to save up to 58% glass, 100% metal, 59% plastic, and 42% paper.", "claim_short": "Refill saves up to 58% glass", "source_label": "yslbeauty.com, Libre Eau de Parfum Intense", "source_url": "https://www.yslbeauty.com/int/fragrance/feminine-fragrance/ysl-libre-eau-de-parfum-intense/WW-50657YSL.html", "checked_on": "26 September 2026", "steps": [{"title": "Read the product page", "detail": "Found a claim with four percentages and a footnote.", "source": "Brand website"}, {"title": "Recognised the claim type", "detail": "Numbers need measurements behind them, not a certificate.", "source": "Agent decision"}, {"title": "Read the stated basis", "detail": "Footnote: one refillable 100 ml bottle and one 100 ml refill, compared with two classic 50 ml bottles.", "source": "Brand website"}, {"title": "Searched for the data behind it", "detail": "Looked for component weights, a bill of materials or an independent review. None published.", "source": "Web search"}, {"title": "Knew when to stop", "det
